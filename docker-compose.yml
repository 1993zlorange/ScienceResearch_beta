name: scienceresearch

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scienceresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for the isolated local deployment}
      POSTGRES_DB: scienceresearch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scienceresearch -d scienceresearch"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["alembic", "-c", "database/migrations/alembic.ini", "upgrade", "head"]
    environment:
      SCIENCERESEARCH_DATABASE_URL: postgresql://scienceresearch:${POSTGRES_PASSWORD}@db:5432/scienceresearch
      SCIENCERESEARCH_ENVIRONMENT: production
      SCIENCERESEARCH_ARTIFACT_ROOT: /var/lib/scienceresearch/artifacts
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      SCIENCERESEARCH_DATABASE_URL: postgresql://scienceresearch:${POSTGRES_PASSWORD}@db:5432/scienceresearch
      SCIENCERESEARCH_ENVIRONMENT: production
      SCIENCERESEARCH_ARTIFACT_ROOT: /var/lib/scienceresearch/artifacts
    volumes:
      - artifact-data:/var/lib/scienceresearch/artifacts
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${SCIENCERESEARCH_WEB_BIND_ADDRESS:-127.0.0.1}:${SCIENCERESEARCH_WEB_PORT:-8765}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  artifact-data:
